name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Preparar proyecto
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d fuente
            PROJ=$(dirname "$(find fuente -name pom.xml | head -n 1)")
          else
            PROJ=.
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          sed -i '/<!-- Cumulus/,/<\/dependency>/d' "$PROJ/pom.xml"

      - name: Compilar
        run: |
          set -o pipefail
          mvn -B clean package -f "$PROJ/pom.xml" 2>&1 | tee build.log

      - name: ERRORES (abre este paso)
        if: failure()
        run: grep -E "\.java|COMPILATION|error:" build.log | head -40

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: SemianarquicoMenu
          path: ${{ env.PROJ }}/target/SemianarquicoMenu-*.jar
