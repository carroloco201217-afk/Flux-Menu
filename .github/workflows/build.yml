name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Preparar proyecto
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Usando zip: $ZIP"
            unzip -q "$ZIP" -d fuente
            PROJ=$(dirname "$(find fuente -name pom.xml | head -n 1)")
          else
            PROJ=.
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          sed -i '/<!-- Cumulus/,/<\/dependency>/d' "$PROJ/pom.xml"
          grep -c cumulus "$PROJ/pom.xml" || true

      - name: Compilar
        run: mvn -B clean package -f "$PROJ/pom.xml"

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: SemianarquicoMenu
          path: ${{ env.PROJ }}/target/SemianarquicoMenu-*.jar
