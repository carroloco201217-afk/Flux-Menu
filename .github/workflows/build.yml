name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Permiso para que el workflow pueda subir la carpeta "texturas" al repositorio
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Preparar proyecto
        run: |
          # Busca el .zip del plugin (hasta 2 carpetas de profundidad).
          # Prefiere los que tengan "flux" en el nombre y, si hay varios, el de version mas alta.
          ZIP=$(find . -maxdepth 2 -iname "*flux*.zip" | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -iname "*.zip" | sort -V | tail -n 1)
          fi
          if [ -n "$ZIP" ]; then
            echo "Usando: $ZIP"
            unzip -q "$ZIP" -d fuente
            PROJ=$(dirname "$(find fuente -name pom.xml | head -n 1)")
          else
            PROJ=.
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          sed -i '/<!-- Cumulus/,/<\/dependency>/d' "$PROJ/pom.xml"
          sed -i 's/1\.21\.4-R0\.1-SNAPSHOT/1.21.8-R0.1-SNAPSHOT/' "$PROJ/pom.xml"
          grep -n "paper-api" -A1 "$PROJ/pom.xml"

      - name: Publicar texturas del zip en el repositorio
        run: |
          # Si el zip trae una carpeta "texturas", se copia al repositorio (para el enlace raw de GitHub)
          if [ -d "$PROJ/texturas" ] && [ "$PROJ" != "." ]; then
            mkdir -p texturas
            cp -r "$PROJ/texturas/." texturas/
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add texturas
            if ! git diff --cached --quiet; then
              git commit -m "Actualizar texturas"
              git push
            fi
          fi

      - name: Compilar
        run: |
          set -o pipefail
          mvn -B clean package -f "$PROJ/pom.xml" 2>&1 | tee build.log

      - name: ERRORES (abre este paso)
        if: failure()
        run: grep -E "ERROR.*\.java" build.log | head -40

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: Flux-Menu
          path: ${{ env.PROJ }}/target/Flux-Menu-*.jar
          if-no-files-found: error
