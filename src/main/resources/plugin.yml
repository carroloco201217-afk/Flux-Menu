name: SemianarquicoMenu
version: 2.1.0
main: net.semianarquico.menu.SemianarquicoMenu
api-version: "1.21"
description: Menu principal con dialogos nativos (Java) y DeluxeMenus (Bedrock), kits con precio, warps y tinte FLUX MENU
authors: [Semianarquico]
softdepend: [Vault, BetterRTP, floodgate, DeluxeMenus]
loadbefore: [PlayerKits, Essentials]

commands:
  menu:
    description: Abre el menu principal
    usage: /menu
    aliases: [menuprincipal]
  kit:
    description: Kits (abre el menu, reclama o administra kits)
    usage: /kit [nombre] | /kit create <nombre> <precio> [categoria]
    aliases: [kits]
  warp:
    description: Abre el menu de warps o va a un warp
    usage: /warp [nombre]
    aliases: [warps]
  setwarp:
    description: Crea un warp en tu posicion
    usage: /setwarp <nombre> [descripcion]
  delwarp:
    description: Borra un warp
    usage: /delwarp <nombre>
  warpdesc:
    description: Cambia la descripcion de un warp
    usage: /warpdesc <nombre> <descripcion>

permissions:
  semianarquico.menu:
    description: Permite usar /menu
    default: true
  semianarquico.menu.reload:
    description: Permite recargar la configuracion
    default: op
  semianarquico.kits.admin:
    description: Crear, borrar y editar kits
    default: op
  semianarquico.kits.premium:
    description: Acceso a la categoria de kits premium
    default: op
  semianarquico.kits.streamer:
    description: Acceso a la categoria de kits streamer
    default: op
  semianarquico.warp.admin:
    description: Crear y borrar warps
    default: op
